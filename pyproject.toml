[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "sakila-metadata-experiment"
version = "0.1.0"
description = "Reproducible metadata-controlled Text-to-SQL thesis experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.14.1",
  "httpx==0.28.1",
  "pymysql[rsa]==1.2.3",
  "sqlglot==30.25.0",
]

[project.scripts]
sakila-experiment = "sakila_experiment.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]
analysis = ["numpy==2.5.4", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the isolated research MySQL instance"]

